[project]
name = "apikeys-platform"
version = "0.1.0"
description = "Async SDK for issuing and validating scoped API keys"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AKSHILMY" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: AsyncIO",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pydantic>=2.0,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13",
    "greenlet>=3.0",
]

[project.optional-dependencies]
sqlite     = ["aiosqlite>=0.19"]
postgresql = ["asyncpg>=0.29", "psycopg2-binary>=2.9"]
all        = ["apikeys-platform[sqlite,postgresql]"]
dev        = ["pytest>=8", "pytest-asyncio>=0.24", "aiosqlite>=0.19"]

[project.urls]
Repository = "https://github.com/AKSHILMY/api-project"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apikeys*"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
